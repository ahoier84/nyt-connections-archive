<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connections Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow: #f9df6d;
      --green: #a0c35a;
      --blue: #b0c4ef;
      --purple: #ba81c5;
      --tile-bg: #efefe6;
      --tile-hover: #ddddd4;
      --tile-selected: #5a594e;
      --tile-selected-text: #ffffff;
      --border: #d3d6da;
      --text: #1a1a1b;
      --text-muted: #6b6b6b;
      --bg: #ffffff;
      --header-border: #e6e6e6;
      --win-color: #a0c35a;
      --loss-color: #d9534f;
      --header-h: 52px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      /* Use dvh when available so mobile browser chrome doesn't cut off content */
      height: 100dvh;
    }

    body {
      font-family: 'Libre Franklin', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden; /* prevent body scroll; main scrolls if needed */
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--header-border);
      padding: 0 clamp(10px, 3vw, 20px);
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
      background: var(--bg);
      z-index: 10;
    }

    .logo {
      font-size: clamp(0.85rem, 3vw, 1.2rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    /* Hide logo text on very narrow screens to save space */
    @media (max-width: 360px) { .logo { display: none; } }

    .header-center {
      display: flex;
      align-items: center;
      gap: clamp(4px, 1.5vw, 8px);
      flex: 1;
      justify-content: center;
    }

    .nav-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: none;
      cursor: pointer;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      color: var(--text);
      flex-shrink: 0;
    }
    .nav-btn:hover:not(:disabled) { background: var(--tile-bg); }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    #current-date {
      font-size: clamp(0.75rem, 2.5vw, 0.88rem);
      font-weight: 600;
      min-width: 0;
      width: clamp(110px, 30vw, 150px);
      text-align: center;
      cursor: pointer;
      padding: 5px 6px;
      border-radius: 6px;
      transition: background 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #current-date:hover { background: var(--tile-bg); }

    .header-right {
      display: flex;
      gap: clamp(4px, 1.5vw, 8px);
      align-items: center;
      flex-shrink: 0;
    }

    .hdr-btn {
      padding: clamp(5px, 1vw, 7px) clamp(9px, 2vw, 13px);
      border-radius: 50px;
      border: 1.5px solid var(--text);
      background: none;
      font-family: inherit;
      font-size: clamp(0.72rem, 2vw, 0.82rem);
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      color: var(--text);
      white-space: nowrap;
    }
    .hdr-btn:hover { background: var(--text); color: white; }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* Adaptive padding — less on small screens */
      padding: clamp(10px, 2.5vh, 20px) clamp(10px, 3vw, 20px) clamp(10px, 2vh, 24px);
      max-width: 620px;
      width: 100%;
      margin: 0 auto;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* ── Loading ── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding-top: clamp(40px, 10vh, 80px);
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #loading p { color: var(--text-muted); font-size: 0.95rem; }

    /* ── Game area ── */
    #game-area {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .subtitle {
      font-size: clamp(0.78rem, 2.2vw, 0.9rem);
      color: var(--text-muted);
      margin-bottom: clamp(8px, 2vh, 16px);
    }

    /* ── Categories ── */
    #categories-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: clamp(5px, 1.2vw, 8px);
    }

    .category-block {
      border-radius: 8px;
      padding: clamp(10px, 2.5vw, 14px) clamp(12px, 3vw, 16px);
      text-align: center;
      animation: slideDown 0.35s ease forwards;
    }
    .cat-name {
      font-weight: 800;
      font-size: clamp(0.78rem, 2.2vw, 0.95rem);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 2px;
    }
    .cat-members {
      font-size: clamp(0.72rem, 1.9vw, 0.82rem);
      font-weight: 500;
      opacity: 0.85;
    }

    /* ── Tile grid ── */
    #tile-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(4px, 1.3vw, 8px);
      width: 100%;
      margin-top: clamp(5px, 1.2vw, 8px);
    }

    .tile {
      background: var(--tile-bg);
      border: none;
      border-radius: clamp(6px, 1.5vw, 8px);
      /*
       * Tile height: scales with viewport width (tiles fill the grid width),
       * but is also capped by available vertical space via vh.
       * clamp(min, preferred, max)
       * On 375px wide: ~13.5vw ≈ 51px, capped between 46-78px
       * On 768px wide: capped at 78px
       */
      height: clamp(46px, min(13.5vw, 13vh), 78px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4px 5px;
      font-family: inherit;
      font-size: clamp(0.62rem, min(1.8vw, 1.6vh), 0.82rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      cursor: pointer;
      user-select: none;
      transition: background 0.12s, color 0.12s;
      outline: none;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
    }
    .tile:hover { background: var(--tile-hover); }
    .tile.selected { background: var(--tile-selected); color: var(--tile-selected-text); }
    .tile.shake { animation: shake 0.5s ease; }
    .tile.pop-0 { animation: pop 0.4s ease 0ms both; }
    .tile.pop-1 { animation: pop 0.4s ease 80ms both; }
    .tile.pop-2 { animation: pop 0.4s ease 160ms both; }
    .tile.pop-3 { animation: pop 0.4s ease 240ms both; }

    /* ── Message ── */
    #message {
      height: clamp(24px, 4vh, 28px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.8rem, 2.2vw, 0.9rem);
      font-weight: 700;
      margin-top: clamp(6px, 1.5vh, 10px);
    }
    .msg-pill {
      background: var(--text);
      color: white;
      padding: 4px 14px;
      border-radius: 50px;
      animation: fadeUp 0.2s ease;
    }

    /* ── Mistakes ── */
    #mistakes-area {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: clamp(4px, 1.2vh, 8px);
      font-size: clamp(0.78rem, 2.1vw, 0.88rem);
      color: var(--text-muted);
      font-weight: 500;
    }
    .dots { display: flex; gap: 5px; }
    .dot {
      width: 11px; height: 11px;
      border-radius: 50%;
      background: var(--text);
      transition: transform 0.25s, background 0.25s;
    }
    .dot.used { background: #c4c4bb; transform: scale(0.75); }

    /* ── Controls ── */
    #controls {
      display: flex;
      gap: clamp(6px, 1.5vw, 10px);
      margin-top: clamp(10px, 2vh, 16px);
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: clamp(9px, 1.8vh, 12px) clamp(14px, 3.5vw, 22px);
      border-radius: 50px;
      border: 1.5px solid var(--text);
      background: none;
      font-family: inherit;
      font-size: clamp(0.78rem, 2.1vw, 0.88rem);
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, opacity 0.15s;
      color: var(--text);
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: var(--text); color: white; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
    .btn-primary { background: var(--text); color: white; }
    .btn-primary:hover:not(:disabled) { background: #333; }

    /* ── Result screen ── */
    #result-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 2vh, 16px);
      padding: clamp(16px, 4vh, 28px) clamp(12px, 4vw, 20px);
      text-align: center;
      width: 100%;
    }
    #result-screen.show { display: flex; }
    .result-title { font-size: clamp(1.2rem, 5vw, 1.6rem); font-weight: 800; }
    .result-sub { font-size: clamp(0.82rem, 2.2vw, 0.9rem); color: var(--text-muted); }
    .result-categories { width: 100%; display: flex; flex-direction: column; gap: clamp(5px, 1.2vw, 8px); }
    .result-grid { display: flex; flex-direction: column; gap: 4px; }
    .result-row { display: flex; gap: 4px; }
    .result-sq { width: clamp(22px, 6vw, 30px); height: clamp(22px, 6vw, 30px); border-radius: 4px; }
    .result-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

    /* ── Modals (shared) ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }

    .modal-card {
      background: white;
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-width: 480px;
      /* Use dvh when available for accurate mobile height */
      max-height: 85vh;
      max-height: 85dvh;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.25s ease;
    }

    /* On wider screens, center the modal vertically */
    @media (min-width: 480px) {
      .modal-overlay { align-items: center; }
      .modal-card {
        border-radius: 16px;
        max-height: 80vh;
        max-height: 80dvh;
      }
    }

    /* On landscape phones, reduce modal height */
    @media (max-height: 500px) {
      .modal-card {
        max-height: 92vh;
        max-height: 92dvh;
        border-radius: 12px 12px 0 0;
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: clamp(14px, 2.5vh, 18px) 20px clamp(10px, 1.5vh, 12px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .modal-title {
      font-size: clamp(0.9rem, 2.5vw, 1.05rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .close-modal {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: none;
      background: var(--tile-bg);
      cursor: pointer;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .close-modal:hover { background: var(--border); }

    /* ── Archive modal ── */
    .date-scroll { overflow-y: auto; flex: 1; padding: 6px 12px 16px; -webkit-overflow-scrolling: touch; }
    .date-group-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      padding: 10px 8px 4px;
    }
    .date-item {
      padding: clamp(7px, 1.5vw, 9px) 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: clamp(0.82rem, 2.3vw, 0.88rem);
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      transition: background 0.12s;
    }
    .date-item:hover { background: var(--tile-bg); }
    .date-item.active { background: var(--text); color: white; }

    .status-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 50px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .badge-won { background: var(--win-color); color: #1a1a1b; }
    .badge-lost { background: var(--loss-color); color: white; }
    .date-item.active .status-badge { opacity: 0.85; }

    /* ── Stats modal ── */
    .stats-body {
      overflow-y: auto;
      flex: 1;
      padding: clamp(12px, 2vh, 16px) 20px clamp(12px, 2vh, 20px);
      -webkit-overflow-scrolling: touch;
    }

    .stats-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(6px, 2vw, 10px);
      margin-bottom: clamp(16px, 3vh, 24px);
    }
    .stat-card {
      background: var(--tile-bg);
      border-radius: 10px;
      padding: clamp(8px, 2vw, 12px) clamp(4px, 1vw, 6px);
      text-align: center;
    }
    .stat-value {
      font-size: clamp(1.3rem, 5vw, 1.7rem);
      font-weight: 800;
      line-height: 1;
    }
    .stat-label {
      font-size: clamp(0.6rem, 1.6vw, 0.68rem);
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 4px;
    }

    .stats-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .history-list { display: flex; flex-direction: column; gap: 6px; }
    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: clamp(8px, 1.8vw, 10px) 12px;
      border-radius: 10px;
      background: var(--tile-bg);
      cursor: pointer;
      transition: background 0.12s;
    }
    .history-item:hover { background: var(--tile-hover); }

    .history-result-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot-won  { background: var(--win-color); }
    .dot-lost { background: var(--loss-color); }

    .history-date { font-size: clamp(0.78rem, 2.2vw, 0.88rem); font-weight: 600; flex: 1; min-width: 0; }
    .history-mistakes { font-size: clamp(0.7rem, 1.9vw, 0.78rem); color: var(--text-muted); font-weight: 500; white-space: nowrap; }
    .history-mini-grid { display: flex; flex-direction: column; gap: 2px; }
    .history-mini-row  { display: flex; gap: 2px; }
    .history-mini-sq   { width: 10px; height: 10px; border-radius: 2px; }

    .stats-empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 24px 0;
    }

    /* ── Landscape phones (short viewport) ── */
    @media (max-height: 500px) and (orientation: landscape) {
      :root { --header-h: 42px; }

      main {
        padding: 6px clamp(10px, 3vw, 20px) 8px;
        flex-direction: row;
        align-items: flex-start;
        gap: 12px;
        max-width: 100%;
        justify-content: center;
      }

      /* Left column: found categories */
      #categories-area {
        width: 220px;
        flex-shrink: 0;
        gap: 4px;
      }
      .category-block { padding: 7px 10px; }
      .cat-name  { font-size: 0.72rem; }
      .cat-members { font-size: 0.65rem; }

      /* Right column: everything else */
      #game-area { flex: 1; max-width: 380px; }
      .subtitle  { margin-bottom: 6px; font-size: 0.75rem; }

      .tile {
        height: clamp(38px, 8vh, 54px);
        font-size: clamp(0.58rem, 1.4vh, 0.72rem);
      }
      #tile-grid { gap: 4px; margin-top: 4px; }

      #message       { height: 22px; margin-top: 4px; font-size: 0.78rem; }
      #mistakes-area { margin-top: 4px; font-size: 0.78rem; }
      #controls      { margin-top: 8px; gap: 6px; }
      .btn { padding: 7px 14px; font-size: 0.78rem; }
    }

    /* ── Animations ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      15% { transform: translateX(-8px); }
      30% { transform: translateX(7px); }
      45% { transform: translateX(-6px); }
      60% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }
    @keyframes pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.12); }
      70%  { transform: scale(0.95); }
      100% { transform: scale(1); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Connections</div>
  <div class="header-center">
    <button class="nav-btn" id="prev-day" title="Previous day">&#8592;</button>
    <span id="current-date">Loading&hellip;</span>
    <button class="nav-btn" id="next-day" title="Next day">&#8594;</button>
  </div>
  <div class="header-right">
    <button class="hdr-btn" id="stats-btn">Stats</button>
    <button class="hdr-btn" id="archive-btn">Archive</button>
  </div>
</header>

<main>
  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading 365 days of puzzles&hellip;</p>
  </div>

  <!-- Game -->
  <div id="game-area">
    <p class="subtitle">Create four groups of four!</p>
    <div id="categories-area"></div>
    <div id="tile-grid"></div>
    <div id="message"></div>
    <div id="mistakes-area">
      <span>Mistakes remaining:</span>
      <div class="dots">
        <div class="dot" id="dot-0"></div>
        <div class="dot" id="dot-1"></div>
        <div class="dot" id="dot-2"></div>
        <div class="dot" id="dot-3"></div>
      </div>
    </div>
    <div id="controls">
      <button class="btn" id="shuffle-btn">Shuffle</button>
      <button class="btn" id="deselect-btn" disabled>Deselect All</button>
      <button class="btn btn-primary" id="submit-btn" disabled>Submit</button>
    </div>
  </div>

  <!-- Result -->
  <div id="result-screen">
    <div class="result-title" id="result-title"></div>
    <div class="result-sub" id="result-sub"></div>
    <div class="result-categories" id="result-categories"></div>
    <div class="result-grid" id="result-grid"></div>
    <div class="result-btns">
      <button class="btn" id="view-stats-btn">View Stats</button>
      <button class="btn" id="browse-btn">Browse Archive</button>
    </div>
  </div>
</main>

<!-- Archive Modal -->
<div class="modal-overlay" id="date-modal">
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-title">Archive</span>
      <button class="close-modal" id="close-archive">&#x2715;</button>
    </div>
    <div class="date-scroll" id="date-scroll"></div>
  </div>
</div>

<!-- Stats Modal -->
<div class="modal-overlay" id="stats-modal">
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-title">Statistics</span>
      <button class="close-modal" id="close-stats">&#x2715;</button>
    </div>
    <div class="stats-body" id="stats-body"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════

const DATA_URL   = 'https://raw.githubusercontent.com/Eyefyre/NYT-Connections-Answers/main/connections.json';
const STATS_KEY  = 'nyt-connections-stats';
const MAX_MISTAKES = 4;

const COLORS = [
  { bg: '#f9df6d', text: '#1a1a1b', name: 'Yellow' },
  { bg: '#a0c35a', text: '#1a1a1b', name: 'Green'  },
  { bg: '#b0c4ef', text: '#1a1a1b', name: 'Blue'   },
  { bg: '#ba81c5', text: '#1a1a1b', name: 'Purple' },
];

// ═══════════════════════════════════════════════
//  STATS STORAGE  (localStorage, persists forever)
// ═══════════════════════════════════════════════
// Schema: { [date: string]: { result: 'won'|'lost', mistakes: number, guessLog: number[][] } }

function loadStats() {
  try { return JSON.parse(localStorage.getItem(STATS_KEY) || '{}'); }
  catch { return {}; }
}

function saveGameStats(date, won, mistakeCount, log) {
  const stats = loadStats();
  stats[date] = { result: won ? 'won' : 'lost', mistakes: mistakeCount, guessLog: log };
  try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch {}
}

function computeOverallStats(dates) {
  // dates: all puzzle dates newest→oldest
  const stats = loadStats();
  let played = 0, won = 0;
  for (const d of dates) {
    const s = stats[d];
    if (s) { played++; if (s.result === 'won') won++; }
  }
  const winPct = played ? Math.round(won / played * 100) : 0;

  // Max streak (oldest→newest; gap OR loss resets)
  let maxStreak = 0, run = 0;
  for (let i = dates.length - 1; i >= 0; i--) {
    const s = stats[dates[i]];
    if (s && s.result === 'won') { run++; maxStreak = Math.max(maxStreak, run); }
    else { run = 0; }
  }

  // Current streak: starting from the most-recently-played date going backward
  let currentStreak = 0;
  let foundFirst = false;
  for (let i = 0; i < dates.length; i++) {
    const s = stats[dates[i]];
    if (!foundFirst) {
      if (!s) continue; // skip unplayed dates at the front until first played
      foundFirst = true;
    }
    if (s && s.result === 'won') { currentStreak++; }
    else { break; } // loss or gap ends streak
  }

  return { played, won, winPct, currentStreak, maxStreak };
}

// ═══════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════

let allPuzzles   = [];   // sorted newest→oldest
let currentIdx   = -1;
let currentPuzzle = null;

let grid      = [];          // [{word, level, group}] remaining tiles in display order
let selected  = new Set();   // indices into grid
let found     = [];          // [{level, group, members}] in order discovered
let mistakes  = 0;
let gameOver  = false;
let guessLog  = [];          // [[level,level,level,level], ...]

// ═══════════════════════════════════════════════
//  DOM REFS
// ═══════════════════════════════════════════════

const $loading        = document.getElementById('loading');
const $gameArea       = document.getElementById('game-area');
const $categoriesArea = document.getElementById('categories-area');
const $tileGrid       = document.getElementById('tile-grid');
const $message        = document.getElementById('message');
const $resultScreen   = document.getElementById('result-screen');
const $resultTitle    = document.getElementById('result-title');
const $resultSub      = document.getElementById('result-sub');
const $resultCats     = document.getElementById('result-categories');
const $resultGrid     = document.getElementById('result-grid');
const $currentDate    = document.getElementById('current-date');
const $prevDay        = document.getElementById('prev-day');
const $nextDay        = document.getElementById('next-day');
const $shuffleBtn     = document.getElementById('shuffle-btn');
const $deselectBtn    = document.getElementById('deselect-btn');
const $submitBtn      = document.getElementById('submit-btn');
const $dateModal      = document.getElementById('date-modal');
const $dateScroll     = document.getElementById('date-scroll');
const $statsModal     = document.getElementById('stats-modal');
const $statsBody      = document.getElementById('stats-body');

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════

async function init() {
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.json();

    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 365);
    const cutoffStr = cutoff.toISOString().slice(0, 10);

    allPuzzles = raw
      .filter(p => p.date >= cutoffStr)
      .map(p => {
        const answers = p.answers.map((a, i) => ({ ...a, level: a.level < 0 ? i : a.level }));
        answers.sort((a, b) => a.level - b.level);
        return { ...p, answers };
      })
      .sort((a, b) => (a.date < b.date ? 1 : -1));

    $loading.style.display = 'none';
    loadPuzzle(0);
  } catch (err) {
    $loading.innerHTML = `<p style="color:#c00;font-weight:600">
      Failed to load puzzles.<br><small>${err.message}</small><br><br>
      <button class="btn" onclick="location.reload()">Retry</button></p>`;
    console.error(err);
  }
}

// ═══════════════════════════════════════════════
//  PUZZLE LOADING
// ═══════════════════════════════════════════════

function loadPuzzle(idx) {
  if (idx < 0 || idx >= allPuzzles.length) return;
  currentIdx    = idx;
  currentPuzzle = allPuzzles[idx];

  const allTiles = [];
  for (const a of currentPuzzle.answers)
    for (const w of a.members)
      allTiles.push({ word: w, level: a.level, group: a.group });

  grid     = shuffle([...allTiles]);
  selected = new Set();
  found    = [];
  mistakes = 0;
  gameOver = false;
  guessLog = [];

  updateDateDisplay();
  updateNavButtons();
  renderGame();
  $gameArea.style.display = 'flex';
  $resultScreen.classList.remove('show');
  clearMessage();
  renderMistakeDots();
  updateControlButtons();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ═══════════════════════════════════════════════
//  RENDERING
// ═══════════════════════════════════════════════

function renderGame() {
  $categoriesArea.innerHTML = '';
  for (const cat of found) $categoriesArea.appendChild(makeCategoryBlock(cat));

  $tileGrid.innerHTML = '';
  for (let i = 0; i < grid.length; i++) {
    const btn = document.createElement('button');
    btn.className = 'tile' + (selected.has(i) ? ' selected' : '');
    btn.textContent = grid[i].word;
    btn.addEventListener('click', () => onTileClick(i));
    $tileGrid.appendChild(btn);
  }
  fitTileText();
}

function makeCategoryBlock(cat, animate = true) {
  const c = COLORS[cat.level];
  const div = document.createElement('div');
  div.className = 'category-block';
  if (!animate) div.style.animation = 'none';
  div.style.background = c.bg;
  div.style.color = c.text;
  div.innerHTML = `<div class="cat-name">${esc(cat.group)}</div>
    <div class="cat-members">${cat.members.map(esc).join(', ')}</div>`;
  return div;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function getTileBtns() { return Array.from($tileGrid.querySelectorAll('.tile')); }

// Shrink font on tiles whose text overflows the single line
function fitTileText() {
  requestAnimationFrame(() => {
    document.querySelectorAll('.tile').forEach(tile => {
      tile.style.fontSize = '';
      if (tile.scrollWidth > tile.clientWidth) {
        const ratio = (tile.clientWidth - 10) / tile.scrollWidth;
        const base  = parseFloat(getComputedStyle(tile).fontSize);
        tile.style.fontSize = Math.max(base * ratio * 0.92, 7) + 'px';
      }
    });
  });
}

// ═══════════════════════════════════════════════
//  TILE INTERACTION
// ═══════════════════════════════════════════════

function onTileClick(idx) {
  if (gameOver) return;
  selected.has(idx) ? selected.delete(idx) : selected.size < 4 && selected.add(idx);
  syncSelectionUI();
  updateControlButtons();
  clearMessage();
}

function syncSelectionUI() {
  getTileBtns().forEach((b, i) => b.classList.toggle('selected', selected.has(i)));
}

function updateControlButtons() {
  $submitBtn.disabled  = selected.size !== 4 || gameOver;
  $deselectBtn.disabled = selected.size === 0 || gameOver;
  $shuffleBtn.disabled = gameOver;
}

// ═══════════════════════════════════════════════
//  SUBMIT LOGIC
// ═══════════════════════════════════════════════

function onSubmit() {
  if (selected.size !== 4 || gameOver) return;

  const indices = [...selected].sort((a, b) => a - b);
  const tiles   = indices.map(i => grid[i]);
  const levels  = tiles.map(t => t.level);
  const groups  = tiles.map(t => t.group);

  guessLog.push(levels);

  if (groups.every(g => g === groups[0])) handleCorrect(indices, tiles[0]);
  else handleWrong(indices, groups);
}

function handleCorrect(indices, firstTile) {
  const { level, group } = firstTile;
  const answer = currentPuzzle.answers.find(a => a.group === group);

  animatePop(indices, () => {
    const foundWords = new Set(indices.map(i => grid[i].word));
    grid = grid.filter(t => !foundWords.has(t.word));
    selected = new Set();
    found.push({ level, group, members: answer.members });
    renderGame();
    clearMessage();
    updateControlButtons();
    renderMistakeDots();
    if (found.length === 4) setTimeout(() => endGame(true), 500);
  });
}

function handleWrong(indices, groups) {
  const oneAway = groups.some(g => groups.filter(x => x === g).length === 3);
  mistakes++;
  renderMistakeDots();

  animateShake(indices, () => {
    selected = new Set();
    syncSelectionUI();
    updateControlButtons();
    if (oneAway) showMessage('One away…');
    if (mistakes >= MAX_MISTAKES) {
      gameOver = true;
      clearMessage();
      revealRemaining();
    }
  });
}

function revealRemaining() {
  const unfound = currentPuzzle.answers
    .filter(a => !found.find(f => f.group === a.group))
    .sort((a, b) => a.level - b.level);

  let delay = 0;
  for (const answer of unfound) {
    setTimeout(() => {
      found.push({ level: answer.level, group: answer.group, members: answer.members });
      grid = grid.filter(t => t.group !== answer.group);
      renderGame();
      if (found.length === 4) setTimeout(() => endGame(false), 500);
    }, delay);
    delay += 450;
  }
}

function endGame(won) {
  saveGameStats(currentPuzzle.date, won, mistakes, guessLog);
  showResult(won);
}

// ═══════════════════════════════════════════════
//  ANIMATIONS
// ═══════════════════════════════════════════════

function animatePop(indices, callback) {
  const btns = getTileBtns();
  [...indices].sort((a,b) => a-b).forEach((gi, rank) => {
    if (btns[gi]) btns[gi].className = `tile selected pop-${rank}`;
  });
  setTimeout(callback, 400 + 80 * 3 + 50);
}

function animateShake(indices, callback) {
  const btns = getTileBtns();
  indices.forEach(i => btns[i]?.classList.add('shake'));
  setTimeout(() => { indices.forEach(i => btns[i]?.classList.remove('shake')); callback(); }, 520);
}

// ═══════════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════════

function showMessage(msg) {
  $message.innerHTML = msg ? `<span class="msg-pill">${esc(msg)}</span>` : '';
}
function clearMessage() { $message.innerHTML = ''; }

function renderMistakeDots() {
  const remaining = MAX_MISTAKES - mistakes;
  for (let i = 0; i < 4; i++)
    document.getElementById(`dot-${i}`).classList.toggle('used', i >= remaining);
}

function updateDateDisplay() {
  if (!currentPuzzle) return;
  const d = new Date(currentPuzzle.date + 'T12:00:00');
  $currentDate.textContent = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function updateNavButtons() {
  $prevDay.disabled = currentIdx >= allPuzzles.length - 1;
  $nextDay.disabled = currentIdx <= 0;
}

// ═══════════════════════════════════════════════
//  RESULT SCREEN
// ═══════════════════════════════════════════════

function showResult(won) {
  $gameArea.style.display = 'none';
  $resultScreen.classList.add('show');

  $resultTitle.textContent = won ? 'Nice work!' : 'Better luck next time!';
  $resultSub.textContent   = won
    ? `Solved with ${mistakes} mistake${mistakes !== 1 ? 's' : ''}`
    : 'Here\'s how it broke down:';

  $resultCats.innerHTML = '';
  [...found].sort((a, b) => a.level - b.level).forEach(cat =>
    $resultCats.appendChild(makeCategoryBlock(cat, false))
  );

  $resultGrid.innerHTML = '';
  for (const row of guessLog) {
    const rowEl = document.createElement('div');
    rowEl.className = 'result-row';
    row.forEach(lv => {
      const sq = document.createElement('div');
      sq.className = 'result-sq';
      sq.style.background = COLORS[lv]?.bg || '#ccc';
      rowEl.appendChild(sq);
    });
    $resultGrid.appendChild(rowEl);
  }
}

// ═══════════════════════════════════════════════
//  ARCHIVE MODAL
// ═══════════════════════════════════════════════

function openArchiveModal() {
  buildDateList();
  $dateModal.classList.add('show');
  requestAnimationFrame(() => {
    const active = $dateScroll.querySelector('.active');
    if (active) active.scrollIntoView({ block: 'center', behavior: 'instant' });
  });
}

function closeArchiveModal() { $dateModal.classList.remove('show'); }

function buildDateList() {
  $dateScroll.innerHTML = '';
  const stats = loadStats();
  let lastMonth = '';

  for (let i = 0; i < allPuzzles.length; i++) {
    const p = allPuzzles[i];
    const d = new Date(p.date + 'T12:00:00');
    const monthLabel = d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

    if (monthLabel !== lastMonth) {
      const lbl = document.createElement('div');
      lbl.className = 'date-group-label';
      lbl.textContent = monthLabel;
      $dateScroll.appendChild(lbl);
      lastMonth = monthLabel;
    }

    const item = document.createElement('div');
    item.className = 'date-item' + (i === currentIdx ? ' active' : '');
    item.textContent = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

    const s = stats[p.date];
    if (s) {
      const badge = document.createElement('span');
      badge.className = 'status-badge ' + (s.result === 'won' ? 'badge-won' : 'badge-lost');
      badge.textContent = s.result === 'won'
        ? `✓ ${s.mistakes === 0 ? 'Perfect' : s.mistakes + ' mistake' + (s.mistakes !== 1 ? 's' : '')}`
        : `✗ ${s.mistakes} mistake${s.mistakes !== 1 ? 's' : ''}`;
      item.appendChild(badge);
    }

    item.addEventListener('click', () => { closeArchiveModal(); loadPuzzle(i); });
    $dateScroll.appendChild(item);
  }
}

// ═══════════════════════════════════════════════
//  STATS MODAL
// ═══════════════════════════════════════════════

function openStatsModal() {
  buildStatsModal();
  $statsModal.classList.add('show');
}

function closeStatsModal() { $statsModal.classList.remove('show'); }

function buildStatsModal() {
  const dates = allPuzzles.map(p => p.date);
  const { played, won, winPct, currentStreak, maxStreak } = computeOverallStats(dates);
  const stats = loadStats();

  // Summary cards
  const summaryHtml = `
    <div class="stats-summary">
      <div class="stat-card"><div class="stat-value">${played}</div><div class="stat-label">Played</div></div>
      <div class="stat-card"><div class="stat-value">${winPct}%</div><div class="stat-label">Win %</div></div>
      <div class="stat-card"><div class="stat-value">${currentStreak}</div><div class="stat-label">Streak</div></div>
      <div class="stat-card"><div class="stat-value">${maxStreak}</div><div class="stat-label">Best</div></div>
    </div>
    <div class="stats-section-title">Game History</div>
  `;

  // History list — only played puzzles, newest first
  const played_puzzles = allPuzzles.filter(p => stats[p.date]);

  let historyHtml = '';
  if (played_puzzles.length === 0) {
    historyHtml = '<div class="stats-empty">No games played yet.<br>Start playing to see your history!</div>';
  } else {
    historyHtml = '<div class="history-list">';
    for (const p of played_puzzles) {
      const s = stats[p.date];
      const d = new Date(p.date + 'T12:00:00');
      const dateStr = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
      const mistakeStr = s.mistakes === 0 ? 'Perfect!' : `${s.mistakes} mistake${s.mistakes !== 1 ? 's' : ''}`;

      // Mini guess grid
      let miniGrid = '';
      if (s.guessLog && s.guessLog.length) {
        miniGrid = '<div class="history-mini-grid">';
        for (const row of s.guessLog) {
          miniGrid += '<div class="history-mini-row">';
          for (const lv of row) {
            miniGrid += `<div class="history-mini-sq" style="background:${COLORS[lv]?.bg || '#ccc'}"></div>`;
          }
          miniGrid += '</div>';
        }
        miniGrid += '</div>';
      }

      const dotClass = s.result === 'won' ? 'dot-won' : 'dot-lost';
      historyHtml += `
        <div class="history-item" data-date="${esc(p.date)}">
          <div class="history-result-dot ${dotClass}"></div>
          <div class="history-date">${esc(dateStr)}</div>
          <div class="history-mistakes">${esc(mistakeStr)}</div>
          ${miniGrid}
        </div>`;
    }
    historyHtml += '</div>';
  }

  $statsBody.innerHTML = summaryHtml + historyHtml;

  // Click a history item → navigate to that puzzle
  $statsBody.querySelectorAll('.history-item').forEach(el => {
    el.addEventListener('click', () => {
      const date = el.dataset.date;
      const idx = allPuzzles.findIndex(p => p.date === date);
      if (idx !== -1) { closeStatsModal(); loadPuzzle(idx); }
    });
  });
}

// ═══════════════════════════════════════════════
//  EVENT LISTENERS
// ═══════════════════════════════════════════════

$prevDay.addEventListener('click', () => { if (currentIdx < allPuzzles.length - 1) loadPuzzle(currentIdx + 1); });
$nextDay.addEventListener('click', () => { if (currentIdx > 0) loadPuzzle(currentIdx - 1); });

document.getElementById('archive-btn').addEventListener('click', openArchiveModal);
$currentDate.addEventListener('click', openArchiveModal);
document.getElementById('close-archive').addEventListener('click', closeArchiveModal);
$dateModal.addEventListener('click', e => { if (e.target === $dateModal) closeArchiveModal(); });

document.getElementById('stats-btn').addEventListener('click', openStatsModal);
document.getElementById('close-stats').addEventListener('click', closeStatsModal);
$statsModal.addEventListener('click', e => { if (e.target === $statsModal) closeStatsModal(); });

document.getElementById('view-stats-btn').addEventListener('click', () => {
  $resultScreen.classList.remove('show');
  openStatsModal();
});
document.getElementById('browse-btn').addEventListener('click', openArchiveModal);

$shuffleBtn.addEventListener('click', () => {
  grid = shuffle([...grid]);
  selected = new Set();
  renderGame();
  updateControlButtons();
});

$deselectBtn.addEventListener('click', () => {
  selected = new Set();
  syncSelectionUI();
  updateControlButtons();
  clearMessage();
});

$submitBtn.addEventListener('click', onSubmit);

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !$submitBtn.disabled) onSubmit();
  if (e.key === 'Escape') {
    if ($statsModal.classList.contains('show')) closeStatsModal();
    else if ($dateModal.classList.contains('show')) closeArchiveModal();
    else if (selected.size > 0) { selected = new Set(); syncSelectionUI(); updateControlButtons(); clearMessage(); }
  }
});

// ═══════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════
init();
</script>
</body>
</html>
